# ---------------------------------------------------------------------------
# Rate limiting (per client IP). These zones live in the http context because
# this file is included from nginx's http block (conf.d/default.conf).
# ---------------------------------------------------------------------------
limit_req_zone  $binary_remote_addr zone=urs_general:10m rate=20r/s;
limit_req_zone  $binary_remote_addr zone=urs_api:10m     rate=5r/s;
limit_conn_zone $binary_remote_addr zone=urs_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# Do not advertise the nginx version.
server_tokens off;

# Drop slow-loris style connections early.
client_body_timeout   15s;
client_header_timeout 15s;
send_timeout          30s;

# Content-Security-Policy for the React app. No 'unsafe-eval': the production
# bundle does not need it. 'unsafe-inline' stays for TanStack's inline
# hydration script and inline styles.
map $uri $urs_csp {
    default "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.lovable.app https://app.powerbi.com; frame-src 'self' https://app.powerbi.com https://*.powerbi.com https://falgimajid-art.github.io; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests";
    # The embedded station checklist is a standalone page that loads Tailwind
    # from its CDN; only that page may run it.
    ~^/checklist/ "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com; connect-src 'self'; worker-src 'self' blob:; upgrade-insecure-requests";
}

# Reject requests for any host name other than ours (direct-IP scans, spoofed
# Host headers). 444 closes the connection without a response.
server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / { return 444; }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    server_name jrwts-urs-operation.com www.jrwts-urs-operation.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name jrwts-urs-operation.com www.jrwts-urs-operation.com;

    ssl_certificate     /etc/letsencrypt/live/jrwts-urs-operation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jrwts-urs-operation.com/privkey.pem;

    # Modern TLS only (Mozilla "intermediate" profile).
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:URS_SSL:10m;
    ssl_session_tickets off;

    # Uploads go straight to Supabase Storage, so the app itself only receives
    # small JSON bodies. A small limit blocks oversized-payload attacks.
    keepalive_timeout 30s;

    client_max_body_size 5m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    limit_conn urs_conn 40;

    # Single source of truth for security headers: drop the copies the Node app
    # adds so the browser never receives two conflicting policies.
    proxy_hide_header X-Powered-By;
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Content-Security-Policy $urs_csp always;

    # Block internal dev/file-system endpoints and hidden files.
    location ^~ /server/ { return 404; }
    location ^~ /@fs/   { return 404; }
    location ^~ /@vite/ { return 404; }
    location ~ /\.(?!well-known/) { return 404; }
    location ~* \.(env|git|sql|bak|old|orig|swp|log|ini|sh)$ { return 404; }

    # Server functions, API routes and the MCP endpoint: stricter rate limit.
    location ~ ^/(_serverFn|api|mcp)(/|$) {
        limit_req zone=urs_api burst=20 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        limit_req zone=urs_general burst=80 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
