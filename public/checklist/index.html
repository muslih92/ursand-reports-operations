
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STATION CHECK LIST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --wtc-dark:  #001F3A;
            --wtc-navy:  #003B5C;
            --wtc-blue:  #0077B6;
            --wtc-cyan:  #00B4D8;
            --wtc-light: #90E0EF;
            --wtc-bg:    #F0F8FF;
            --wtc-accent:#00CFE8;
        }
        * { font-family: 'IBM Plex Sans Arabic', sans-serif; box-sizing: border-box; }
        body { background: var(--wtc-bg); color: #0d2137; -webkit-font-smoothing: antialiased; margin:0; }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
        input[type="number"] { -moz-appearance:textfield; }

        /* ── Splash ── */
        #splash {
            position:fixed; inset:0; z-index:9999;
            background: var(--wtc-dark);
            display:flex; flex-direction:column; align-items:center; justify-content:center;
            overflow:hidden;
        }
        .sp-grid {
            position:absolute; inset:0;
            background-image: linear-gradient(rgba(0,180,216,.04) 1px,transparent 1px),
                              linear-gradient(90deg,rgba(0,180,216,.04) 1px,transparent 1px);
            background-size:40px 40px;
        }
        .sp-glow {
            position:absolute; inset:0;
            background: radial-gradient(ellipse at 20% 80%,rgba(0,180,216,.15) 0%,transparent 50%),
                        radial-gradient(ellipse at 80% 20%,rgba(0,95,142,.2) 0%,transparent 50%);
        }
        .sp-ripple {
            position:absolute; border-radius:50%;
            border:1px solid rgba(0,180,216,.12);
            animation: ripple 5s ease-out infinite;
        }
        .sp-ripple:nth-child(1){width:280px;height:280px;animation-delay:0s}
        .sp-ripple:nth-child(2){width:480px;height:480px;animation-delay:1.4s}
        .sp-ripple:nth-child(3){width:680px;height:680px;animation-delay:2.8s}
        @keyframes ripple { 0%{transform:scale(.5);opacity:.5} 100%{transform:scale(1.6);opacity:0} }

        .sp-content { position:relative; z-index:10; text-align:center; display:flex; flex-direction:column; align-items:center; gap:20px; }

        .sp-ring { position:relative; width:120px; height:120px; }
        .sp-ring svg { position:absolute; inset:0; animation: rotate 8s linear infinite; }
        @keyframes rotate { to { transform:rotate(360deg); } }
        .sp-logo-box {
            position:absolute; inset:14px; border-radius:50%;
            background:rgba(0,95,142,.25); backdrop-filter:blur(6px);
            border:1px solid rgba(0,180,216,.25);
            display:flex; align-items:center; justify-content:center; overflow:hidden;
        }
        .sp-logo-box img { width:62px; height:62px; object-fit:contain; }
        .sp-logo-fallback { color:var(--wtc-cyan); font-size:22px; font-weight:900; }

        .sp-title {
            color:rgba(255,255,255,.85); font-size:13px; font-weight:500; letter-spacing:.05em;
            opacity:0; animation: fadeUp .7s ease forwards .4s;
        }
        .sp-company { opacity:0; animation: fadeUp .7s ease forwards .7s; }
        .sp-company-ar { font-size:11px; font-weight:600; color:rgba(255,255,255,.8); }
        .sp-company-en { font-size:8px; font-weight:300; color:var(--wtc-cyan); letter-spacing:.2em; text-transform:uppercase; margin-top:3px; }

        .sp-bar-wrap { width:180px; opacity:0; animation: fadeUp .7s ease forwards 1s; }
        .sp-bar-bg { height:2px; background:rgba(255,255,255,.1); border-radius:99px; overflow:hidden; }
        .sp-bar-fill { height:100%; background:linear-gradient(90deg,var(--wtc-blue),var(--wtc-cyan),var(--wtc-accent)); border-radius:99px; width:0%; animation: fill 1.6s ease forwards 1.2s; }
        @keyframes fill { to { width:100%; } }
        .sp-bar-text { font-size:8px; color:rgba(255,255,255,.3); letter-spacing:.18em; text-align:center; margin-top:7px; font-weight:300; }

        .sp-year { position:absolute; bottom:28px; font-size:8px; color:rgba(255,255,255,.15); letter-spacing:.3em; font-weight:300; opacity:0; animation: fadeUp .7s ease forwards 1.3s; }

        @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
        .sp-title, .sp-company, .sp-bar-wrap { transform:translateY(14px); }

        #splash.out { animation: splashOut .65s ease forwards; }
        @keyframes splashOut { to { opacity:0; transform:scale(1.03); pointer-events:none; } }

        /* ── Header ── */
        .wtc-header {
            background:linear-gradient(135deg, var(--wtc-dark) 0%, var(--wtc-navy) 60%, var(--wtc-blue) 100%);
            border-bottom:1px solid rgba(0,180,216,.18);
            position:sticky; top:0; z-index:100;
            display:flex; justify-content:space-between; align-items:center;
            padding:10px 16px;
            box-shadow: 0 2px 16px rgba(0,30,60,.3);
        }
        .wtc-header-logo { height:36px; object-fit:contain; background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:4px; }
        .wtc-header-name { font-size:11px; font-weight:700; color:#90E0EF; }
        .wtc-header-sub  { font-size:7px; font-weight:300; color:rgba(144,224,239,.55); letter-spacing:.18em; text-transform:uppercase; margin-top:2px; }
        .sup-btn { padding:7px 13px; border-radius:11px; font-size:10px; font-weight:700; background:rgba(255,255,255,.08); color:rgba(255,255,255,.85); border:1px solid rgba(255,255,255,.13); cursor:pointer; transition:all .2s; white-space:nowrap; }
        .sup-btn:hover { background:rgba(255,255,255,.15); color:white; }

        /* ── Page bg by time ── */
        .bg-day   { background:linear-gradient(180deg,#e0f2fe 0%,var(--wtc-bg) 45%); min-height:calc(100vh - 56px); }
        .bg-night { background:linear-gradient(180deg,#001e3c 0%,#002d55 35%,#0d2137 65%,var(--wtc-bg) 100%); min-height:calc(100vh - 56px); }

        /* ── Cards ── */
        .card { background:white; border:1.5px solid rgba(0,95,142,.1); border-radius:22px; box-shadow:0 4px 24px rgba(0,59,92,.08); }
        .card-dark { background:linear-gradient(135deg,var(--wtc-dark),var(--wtc-navy)); border:1px solid rgba(0,180,216,.15); border-radius:20px; box-shadow:0 6px 24px rgba(0,30,60,.3); position:relative; overflow:hidden; }
        .card-dark::before { content:''; position:absolute; top:-40px; right:-40px; width:120px; height:120px; background:radial-gradient(circle,rgba(0,180,216,.18),transparent 70%); border-radius:50%; }

        /* ── Input ── */
        .wtc-input { width:100%; padding:13px 16px; border:1.5px solid rgba(0,95,142,.18); border-radius:13px; font-size:12px; font-family:'IBM Plex Sans Arabic',sans-serif; background:rgba(240,248,255,.7); color:var(--wtc-navy); text-align:center; outline:none; transition:all .2s; }
        .wtc-input:focus { border-color:var(--wtc-blue); background:white; box-shadow:0 0 0 3px rgba(0,119,182,.12); }
        select.wtc-input { cursor:pointer; }
        textarea.wtc-input { text-align:right; resize:none; }

        /* ── Buttons ── */
        .btn-primary { width:100%; padding:14px 20px; background:linear-gradient(135deg,var(--wtc-navy),var(--wtc-blue)); color:white; border:none; border-radius:13px; font-size:12px; font-weight:700; font-family:'IBM Plex Sans Arabic',sans-serif; cursor:pointer; transition:all .25s; box-shadow:0 4px 18px rgba(0,95,142,.35); }
        .btn-primary:hover { transform:translateY(-1px); box-shadow:0 7px 26px rgba(0,95,142,.45); }
        .btn-primary:active { transform:scale(.98); }

        .btn-exit { font-size:10px; background:#fee2e2; color:#991b1b; border:none; padding:8px 13px; border-radius:11px; font-weight:700; cursor:pointer; font-family:'IBM Plex Sans Arabic',sans-serif; transition:all .2s; }
        .btn-exit:hover { background:#fecaca; }
        .btn-back { background:white; padding:8px 13px; border-radius:11px; font-size:10px; font-weight:700; color:#64748b; border:1.5px solid rgba(0,95,142,.12); cursor:pointer; font-family:'IBM Plex Sans Arabic',sans-serif; box-shadow:0 1px 4px rgba(0,30,60,.06); transition:all .2s; }

        /* ── Status buttons ── */
        .s-btn { padding:12px 6px; border-radius:13px; font-size:10px; font-weight:700; text-align:center; border:1.5px solid rgba(0,95,142,.1); background:#f0f8ff; color:#475569; cursor:pointer; transition:all .2s; font-family:'IBM Plex Sans Arabic',sans-serif; }
        .s-btn.ok   { background:#064e3b; color:white; border-color:#064e3b; }
        .s-btn.rem  { background:#92400e; color:white; border-color:#78350f; }
        .s-btn.na   { background:#1e3a5f; color:white; border-color:#1e3a5f; }

        /* ── System cards ── */
        .sys-card { background:white; border:1.5px solid rgba(0,95,142,.1); border-radius:15px; padding:13px 15px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; transition:all .2s; box-shadow:0 1px 4px rgba(0,59,92,.05); }
        .sys-card:hover { background:#f0f8ff; border-color:rgba(0,119,182,.25); }
        .sys-card.ok  { border-color:rgba(16,185,129,.3); background:rgba(240,253,244,.7); }
        .sys-card.rem { border-color:rgba(245,158,11,.35); background:rgba(255,251,235,.7); }

        /* ── Badges ── */
        .badge { display:inline-block; padding:3px 9px; border-radius:99px; font-size:9px; font-weight:700; }
        .b-ok   { background:#d1fae5; color:#065f46; }
        .b-rem  { background:#fef3c7; color:#92400e; }
        .b-pend { background:#fee2e2; color:#991b1b; }
        .b-live { background:rgba(0,180,216,.15); color:var(--wtc-blue); }
        .line-badge { display:inline-block; font-size:8px; font-weight:700; padding:3px 9px; border-radius:6px; background:rgba(0,180,216,.12); color:var(--wtc-cyan); border:1px solid rgba(0,180,216,.2); letter-spacing:.08em; }

        /* ── Progress ── */
        .prog-fill { background:linear-gradient(90deg,var(--wtc-blue),var(--wtc-cyan)); height:100%; border-radius:99px; transition:width .6s cubic-bezier(.4,0,.2,1); }

        /* ── FAB ── */
        .fab { background:linear-gradient(135deg,var(--wtc-navy),var(--wtc-blue)); border-radius:50px; padding:13px 26px; color:white; font-weight:700; font-size:11px; border:1px solid rgba(255,255,255,.14); box-shadow:0 8px 28px rgba(0,30,60,.35); display:flex; align-items:center; gap:8px; cursor:pointer; transition:all .25s; font-family:'IBM Plex Sans Arabic',sans-serif; }
        .fab:hover { transform:translateY(-2px); box-shadow:0 12px 34px rgba(0,30,60,.45); }

        /* ── Sticky save bar ── */
        .save-bar { position:fixed; bottom:0; right:0; width:100%; padding:14px; background:rgba(255,255,255,.93); backdrop-filter:blur(12px); border-top:1px solid rgba(0,95,142,.1); box-shadow:0 -4px 20px rgba(0,30,60,.07); z-index:40; }

        /* ── Scrollbar ── */
        ::-webkit-scrollbar { width:3px; }
        ::-webkit-scrollbar-thumb { background:rgba(0,95,142,.25); border-radius:99px; }

        /* ── Transition ── */
        .fade { transition: opacity .25s ease; }

        /* ── Banner bar (no greeting text) ── */
        .shift-bar { border-radius:18px; padding:16px 18px; position:relative; overflow:hidden; margin-bottom:18px; }
        .shift-bar.day   { background:linear-gradient(135deg,var(--wtc-blue),var(--wtc-cyan)); color:white; }
        .shift-bar.night { background:linear-gradient(135deg,var(--wtc-dark),var(--wtc-navy)); color:white; border:1px solid rgba(0,180,216,.18); }
        .shift-bar::after { content:''; position:absolute; top:-18px; left:-18px; width:70px; height:70px; border-radius:50%; background:rgba(255,255,255,.06); }

        /* ── Modal overlay ── */
        .overlay { position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; padding:16px; background:rgba(0,15,40,.75); backdrop-filter:blur(6px); }

        .pad { padding:16px; max-width:480px; margin:0 auto; }

        /* ── Responsive: tablet / desktop ── */
        @media (min-width: 700px) {
            .wtc-header { padding:14px 32px; }
            .wtc-header-logo { height:42px; }
            .wtc-header-name { font-size:13px; }
            .wtc-header-sub { font-size:8px; }
            .sup-btn { padding:9px 18px; font-size:11px; }
            .pad { max-width:760px; padding:24px; }
            #stationList, #adminStationList { display:grid !important; grid-template-columns:repeat(2,1fr); gap:10px; }
            #systemsList { display:grid !important; grid-template-columns:repeat(2,1fr); gap:10px; }
            #checkItemsList { display:grid !important; grid-template-columns:repeat(2,1fr); gap:8px; }
            .save-bar > div { max-width:760px; }
        }
        @media (min-width: 1100px) {
            .pad { max-width:1040px; }
            #systemsList { grid-template-columns:repeat(3,1fr); }
            #stationList, #adminStationList { grid-template-columns:repeat(3,1fr); }
            .save-bar > div { max-width:1040px; }
        }
        @media (max-width: 380px) {
            .wtc-header-name { font-size:10px; }
            .sup-btn { padding:6px 10px; font-size:9px; }
        }
    </style>
</head>
<body>

<!-- ════ APP ════ -->
<div id="app">

    <!-- HEADER -->
    <header class="wtc-header">
        <div style="display:flex; align-items:center; gap:10px;">
            <!-- *** مكان اللوقو في الهيدر — غيّر src بمسار ملفك *** -->
            <img src="https://cdn.phototourl.com/free/2026-05-25-531ef0be-b99a-4016-a928-effa7a2c41ac.png"
                 alt="WTC" class="wtc-header-logo"
                 onerror="this.style.display='none'">
            <div>
                <div class="wtc-header-name">شركة نقل المياه  — الجبيل</div>
                <div class="wtc-header-sub">Water Transmission Company</div>
            </div>
        </div>
        <button class="sup-btn" id="supBtn">🧑‍💼 لوحة المشرف</button>
    </header>

    <!-- SCREENS CONTAINER -->
    <div id="screens" style="padding-bottom:32px;"></div>

</div>

<!-- ════ TEMPLATES ════ -->

<template id="tpl-selectStation">
<div class="pad">
    <div class="shift-bar" id="shiftBar">
        <div style="display:flex;align-items:center;gap:12px;position:relative;z-index:1;">
            <span style="font-size:24px;" id="shiftIcon"></span>
            <div>
                <div style="font-size:14px;font-weight:700;">STATION CHECK LIST</div>
                <div style="font-size:10px;opacity:.75;margin-top:2px;" id="shiftLabel"></div>
            </div>
        </div>
    </div>
    <div class="card" style="padding:22px;">
        <div style="text-align:center;padding-bottom:14px;border-bottom:1px solid rgba(0,95,142,.09);margin-bottom:16px;">
            <div style="font-size:26px;">📍</div>
            <div style="font-size:14px;font-weight:700;color:#003B5C;margin-top:6px;">اختر المحطة</div>
        </div>
        <div id="stationList" style="display:flex;flex-direction:column;gap:8px;"></div>
    </div>
</div>
</template>

<template id="tpl-systems">
<div class="pad">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <div>
            <span class="line-badge" id="lblLine"></span>
            <div style="font-size:20px;font-weight:700;color:#003B5C;margin-top:4px;" id="lblStation"></div>
        </div>
        <button class="btn-exit" id="btnLogout">🔁 تغيير المحطة</button>
    </div>
    <div class="card-dark" style="padding:16px;margin-bottom:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;margin-bottom:12px;">
            <div style="font-size:11px;font-weight:700;color:white;" id="lblShift"></div>
            <div style="background:rgba(0,30,60,.5);padding:10px 14px;border-radius:13px;text-align:center;border:1px solid rgba(0,180,216,.2);">
                <div style="font-size:8px;color:#90e0ef;"></div>
                <div style="font-size:22px;font-weight:700;color:#00CFE8;font-variant-numeric:tabular-nums;" id="kpiNum">0%</div>
            </div>
        </div>
        <div style="width:100%;background:rgba(255,255,255,.08);height:3px;border-radius:99px;overflow:hidden;position:relative;z-index:1;">
            <div class="prog-fill" id="kpiBar" style="width:0%"></div>
        </div>
    </div>
    <div style="background:rgba(0,119,182,.07);border:1px solid rgba(0,119,182,.14);border-radius:13px;padding:8px 12px;font-size:10px;color:#005F8E;font-weight:600;text-align:center;margin-bottom:12px;">
        ⚙️ يمكنك التعديل والحفظ مراراً.
    </div>
    <div style="font-size:9px;font-weight:700;color:#94a3b8;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;">⚙️ أنظمة المحطة :</div>
    <div id="systemsList" style="display:flex;flex-direction:column;gap:8px;margin-bottom:24px;"></div>
</div>
</template>

<template id="tpl-checklist">
<div class="pad" style="padding-bottom:90px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <button class="btn-back" id="btnBackSys">↩ إلغاء والتراجع</button>
        <span style="font-size:10px;background:#001F3A;color:#00CFE8;font-weight:700;padding:6px 13px;border-radius:8px;" id="clkStation"></span>
    </div>
    <div class="card" style="padding:16px;margin-bottom:14px;">
        <div style="margin-bottom:10px;">
            <div style="font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px;">📋 Check Items</div>
            <div id="clkSystem" style="font-size:13px;font-weight:700;color:#003B5C;"></div>
        </div>
        <div style="border-top:1px solid rgba(0,95,142,.08);padding-top:10px;">
        <div id="checkItemsList" style="display:flex;flex-direction:column;gap:6px;"></div>
        </div>
    </div>
    <div class="card" style="padding:16px;">
        <div style="font-size:9px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px;">🎯 النتيجة الإجمالية للنظام:</div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;">
            <button class="s-btn" id="sOk" onclick="setStatus('no_obs')">✓ NO OBSERVATION</button>
            <button class="s-btn" id="sRem" onclick="setStatus('remark')">⚠️ Remark</button>
            <button class="s-btn" id="sNa" onclick="setStatus('na')">N/A</button>
        </div>
        <div id="noObsBox" style="display:none;border-top:1px solid rgba(0,95,142,.08);padding-top:12px;">
            <div>
                <label style="display:block;font-size:10px;font-weight:700;color:#1e3a5f;margin-bottom:6px;">📝 ملاحظة إضافية <span style="color:#94a3b8;font-weight:400;">(اختياري)</span>:</label>
                <textarea id="noObsNote" class="wtc-input" rows="2" placeholder="يمكنك إضافة ملاحظة اختيارية..."></textarea>
            </div>
        </div>
        <div id="naBox" style="display:none;border-top:1px solid rgba(0,95,142,.08);padding-top:12px;">
            <div>
                <label style="display:block;font-size:10px;font-weight:700;color:#1e3a5f;margin-bottom:6px;">📝 سبب عدم الانطباق / ملاحظة N/A <span style="color:#94a3b8;font-weight:400;">(اختياري)</span>:</label>
                <textarea id="naNote" class="wtc-input" rows="2" placeholder="مثال: النظام في حالة صيانة، غير مفعّل، ..."></textarea>
            </div>
        </div>
        <div id="remarkBox" style="display:none;border-top:1px solid rgba(0,95,142,.08);padding-top:12px;">

            <div style="margin-bottom:10px;">
                <label style="display:block;font-size:10px;font-weight:700;color:#94a3b8;margin-bottom:6px;">📝 تفاصيل الخلل الميداني (إجباري):</label>
                <textarea id="noteArea" class="wtc-input" rows="2" placeholder="يرجى وصف المشكلة بدقة..."></textarea>
            </div>
            <div>
                <label style="display:block;font-size:10px;font-weight:700;color:#94a3b8;margin-bottom:6px;">📸 صور الإثبات <span style="color:#94a3b8;font-weight:400;">(اختياري - بحد أقصى 4 صور)</span>:</label>
                <input type="file" accept="image/*" multiple id="imgInput" style="font-size:11px;color:#64748b;width:100%;">
                <div id="imgGrid" style="display:none;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px;background:rgba(0,95,142,.04);border-radius:13px;border:1px solid rgba(0,95,142,.07);"></div>
                <p id="imgMax" style="display:none;font-size:10px;color:#dc2626;margin-top:6px;font-weight:600;">تم الوصول للحد الأقصى (4 صور).</p>
            </div>
        </div>
    </div>
    <div class="save-bar">
        <div style="max-width:560px;margin:0 auto;">
            <button class="btn-primary" id="btnSave">💾 حفظ التقرير</button>
        </div>
    </div>
</div>
</template>

<template id="tpl-adminSelect">
<div class="pad">
    <div class="card" style="padding:22px;">
        <div style="text-align:center;padding-bottom:14px;border-bottom:1px solid rgba(0,95,142,.09);margin-bottom:16px;">
            <div style="font-size:26px;">🏢</div>
            <div style="font-size:14px;font-weight:700;color:#003B5C;margin-top:6px;">المحطات التابعة لصلاحيتك</div>

// يتم تحميلها من Supabase (جدول wtc_items) وتَجُبّ نقاط SYS_ITEMS الافتراضية عند وجودها
var ITEM_OVERRIDES = {};

function getSysItems(sys) {
    if(ITEM_OVERRIDES[sys] && ITEM_OVERRIDES[sys].length) return ITEM_OVERRIDES[sys];
    return SYS_ITEMS[sys] || [
        '1- Check if the system unit status is normal and running without active alarms.',
        '2- Check if any leakage, abnormal noise, or high temperature is detected in the zone.',
        '3- Verify all associated instruments and gauges are reading within normal range.',
        '4- Ensure no active fault or alarm is present on local or remote panels.'
    ];
}

function getAllSystemNames() {
    var set = {};
    Object.keys(STATION_SYSTEMS).forEach(function(code){
        STATION_SYSTEMS[code].forEach(function(sys){ set[sys] = true; });
    });
    return Object.keys(set).sort();
}

// ── أنظمة المحطات القابلة للتعديل من الأدمن ────────────────────────────────
// تُخزَّن في نفس جدول wtc_items بمفتاح خاص: __SYS__:<كود المحطة>
function sysListKey(code){ return '__SYS__:' + code; }
function stationCodeOf(name){
    return Object.keys(STATIONS).find(function(k){ return STATIONS[k].name === name; }) || name;
}
function getStationSystemsOverride(code){
    var v = ITEM_OVERRIDES[sysListKey(code)];
    return (v && v.length) ? v : null;
}
function setStationSystems(code, systems){
    ITEM_OVERRIDES[sysListKey(code)] = systems.slice();
    try { localStorage.setItem('wtc_sys_' + code, JSON.stringify(systems)); } catch(e){}
    pushItemsToSupabase(sysListKey(code), systems);
}
// استرجاع أي قوائم أنظمة محفوظة محلياً (احتياط عند تعذّر الاتصال)
function loadLocalSystemLists(){
    Object.keys(STATIONS).forEach(function(code){
        if(getStationSystemsOverride(code)) return;
        try {
            var raw = localStorage.getItem('wtc_sys_' + code);
            if(raw){
                var arr = JSON.parse(raw);
                if(arr && arr.length) ITEM_OVERRIDES[sysListKey(code)] = arr;
            }
        } catch(e){}
    });
}



// تحميل نقاط الفحص المخصصة (إن وُجدت) من Supabase
function loadItemOverrides(callback) {
    var url = SUPA_URL + '/rest/v1/wtc_items?select=*';
    fetch(url, { headers: supaHeaders() })
    .then(function(r){ return r.json(); })
    .then(function(rows){
        var overrides = {};
        (rows||[]).forEach(function(r){
            var arr = [];
            try { arr = typeof r.items === 'string' ? JSON.parse(r.items) : r.items; }
            catch(e){ arr = []; }
            if(arr && arr.length) overrides[r.system] = arr;
        });
        ITEM_OVERRIDES = overrides;
        loadLocalSystemLists();
        if(callback) callback();
    }).catch(function(e){ console.error('Supabase load items error:', e); loadLocalSystemLists(); if(callback) callback(); });
}

// حفظ نقاط فحص نظام معيّن في Supabase
function pushItemsToSupabase(sys, items) {
    fetch(SUPA_URL + '/rest/v1/wtc_items', {
        method: 'POST',
        headers: Object.assign({}, supaHeaders(), { 'Prefer': 'resolution=merge-duplicates' }),
        body: JSON.stringify({ system: sys, items: JSON.stringify(items) })
    }).then(function(r){
        if(!r.ok) r.text().then(function(t){ console.error('Supabase save items error:', t); });
    }).catch(function(e){ console.error('Supabase network error (items):', e); });
}

function getSystems(st) {
    var code = Object.keys(STATIONS).find(function(k){ return STATIONS[k].name === st; }) || st;
    var ov = getStationSystemsOverride(code);
    if(ov) return ov;
    if(STATION_SYSTEMS[code] && STATION_SYSTEMS[code].length > 0) return STATION_SYSTEMS[code];
    return st && st.includes('FG') ? ['AIR COMPERSSOR SYSTEM','BOOSTER PUMP HOUSE','COOLING WATER SYSTEM','ELECTRICAL VSD BULDING','EMERGENCY GENERATOR','HV, MV, LV, VSD TRANSFORMERS','HVAC AND CHILLERS','INLET SURGE VESSEL SYSTEM','LOW VOLTAGE ROOM','MAIN PUMP HOUSE','MEDIUM VOLTAGE ROOM','OUTLET SURGE VESSEL SYSTEM','PRESSURE RELIEF SYSTEM','TANK FARM AREA','UTILITY & FIRE DIESEL PUPM SYSTEM'] : ['AIR CONDITIONING&VENTILATION SYS-1','COOLING WATER SYSTEM','DRINKING AND UTILITY','ELECTRICAL BUILDING CABLE CELLAER','EMERGENCY GENERATOR','FLOW CONTROL VALVE MAIN','LOW VOLTAGE ROOM','MAIN PUMP HOUSE','MEDIUM VOLTAGE ROOM','PRESSUR CONTROL VALVE','SEWAGE SYSTEM','STATION BATTERIES ROOM','SURGE RELIEF SYSTEM','UNIT CONTROL&FEEDBACK EQUIPMENT','STATION CONRROL ROOM','SCRAPER'];
}
function getShift() { var h = new Date().getHours(); return (h>=6&&h<18)?'صباحي':'مسائي'; }
function getLog(sys, st, sh, dt) {
    st = st || state.station; sh = sh || state.shift; dt = dt || state.date;
    return state.logs.find(l => l.station===st && l.system===sys && l.shift===sh && l.date===dt);
}
function isChecked(sys, st, sh, dt) { return !!getLog(sys, st, sh, dt); }
function kpi(st) {
    var sys = getSystems(st||state.station);
    if(!sys.length) return 0;
    return Math.round(sys.filter(s=>isChecked(s,st)).length/sys.length*100);
}

function pushLogToSupabase(entry) {
    var basePayload = {
        station:  entry.station,
        system:   entry.system,
        shift:    entry.shift,
        date:     entry.date,
        time:     entry.time,
        status:   entry.status,
        note:     entry.note || '',
        op_id:    entry.operator || '',
        line:     entry.line || ''
    };
    // نحاول إرسال الصور أيضاً (عمود images من نوع jsonb/text في جدول Supabase).
    // إذا لم يكن العمود موجوداً بعد في قاعدة البيانات، نعيد الإرسال بدون الصور
    // حتى لا تُفقد بقية بيانات التشييك.
    var withImages = Object.assign({}, basePayload, { images: JSON.stringify(entry.images || []) });
    fetch(SUPA_URL + '/rest/v1/wtc_checklist', {
        method: 'POST',
        headers: supaHeaders(),
        body: JSON.stringify(withImages)
    }).then(function(r){
        if(!r.ok){
            r.text().then(function(t){
                console.error('Supabase save error (with images):', t);
                // إعادة المحاولة بدون حقل الصور كحل احتياطي
                fetch(SUPA_URL + '/rest/v1/wtc_checklist', {
                    method: 'POST',
                    headers: supaHeaders(),
                    body: JSON.stringify(basePayload)
                }).then(function(r2){
                    if(!r2.ok) r2.text().then(function(t2){ console.error('Supabase save error (fallback):', t2); });
                }).catch(function(e2){ console.error('Supabase network error (fallback):', e2); });
            });
        }
    }).catch(function(e){ console.error('Supabase network error:', e); });
}

// Load logs for a specific station+date from Supabase
function loadLogsFromSupabase(station, date, callback) {
    var url = SUPA_URL + '/rest/v1/wtc_checklist?station=eq.' + encodeURIComponent(station) + '&date=eq.' + date + '&select=*&order=time.desc';
    fetch(url, { headers: supaHeaders() })
    .then(function(r){ return r.json(); })
    .then(function(rows){
        // map DB columns back to local entry format
        var logs = rows.map(function(r){
            var imgs = [];
            if(r.images){
                try { imgs = typeof r.images === 'string' ? JSON.parse(r.images) : r.images; }
                catch(e){ imgs = []; }
            }
            return { station:r.station, system:r.system, shift:r.shift, date:r.date,
                     time:r.time, status:r.status, note:r.note, operator:r.op_id, line:r.line, images:imgs||[] };
        });
        callback(logs);
    }).catch(function(e){ console.error('Supabase load error:', e); callback([]); });
}

// Load logs for summary (any date/station)
function loadLogsForSummary(station, date, callback) {
    loadLogsFromSupabase(station, date, callback);
}
function cloneTemplate(id) {
    var t = document.getElementById(id);
    return t.content.cloneNode(true);
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render() {
    var sc = document.getElementById('screens');
    // remove all children safely
    while(sc.firstChild) sc.removeChild(sc.firstChild);

    var h = new Date().getHours();
    var isNight = (h>=18||h<6);

    if (state.screen === 'select')   renderSelect(sc, isNight);
    else if (state.screen === 'systems')  renderSystems(sc);
    else if (state.screen === 'checklist') renderChecklist(sc);
    else if (state.screen === 'adminSel') renderAdminSelect(sc);
    else if (state.screen === 'history')  renderHistory(sc);
    else if (state.screen === 'editItems') renderEditItems(sc);
}

function renderSelect(sc, isNight) {
    var node = cloneTemplate('tpl-selectStation');
    var bar = node.getElementById('shiftBar');
    bar.classList.add(isNight ? 'night' : 'day');
    node.getElementById('shiftIcon').textContent = isNight ? '🌙' : '☀️';
    node.getElementById('shiftLabel').textContent = isNight ? 'الوردية المسائية' : 'الوردية الصباحية';

    var list = node.getElementById('stationList');
    var allowNames = window.WTCO_ALLOWED_STATIONS || null;
    Object.keys(STATIONS).filter(function(code){
        return !allowNames || !allowNames.length || allowNames.indexOf(STATIONS[code].name) !== -1;
    }).forEach(function(code){
        var btn = document.createElement('button');
        btn.style.cssText = 'width:100%;padding:14px 16px;border-radius:15px;text-align:right;font-size:12px;font-weight:700;background:#f0f8ff;border:1.5px solid rgba(0,95,142,.1);display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-family:IBM Plex Sans Arabic,sans-serif;transition:all .2s;';
        btn.innerHTML = '<span style="color:#003B5C;">'+STATIONS[code].name+'</span><span class="line-badge">'+STATIONS[code].line+'</span>';
        btn.onmouseover = function(){ this.style.borderColor='#0077B6'; this.style.background='#e0f2fe'; };
        btn.onmouseout  = function(){ this.style.borderColor='rgba(0,95,142,.1)'; this.style.background='#f0f8ff'; };
        btn.onclick = function(){ selectStation(code); };
        list.appendChild(btn);
    });
    sc.appendChild(node);
    // wrap in bg
    sc.firstElementChild.className = 'pad';
    sc.style.background = isNight
        ? 'linear-gradient(180deg,#001e3c 0%,#002d55 35%,#0d2137 65%,#F0F8FF 100%)'
        : 'linear-gradient(180deg,#e0f2fe 0%,#F0F8FF 45%)';
    sc.style.minHeight = 'calc(100vh - 56px)';
}

function renderSystems(sc) {
    // Load fresh logs from Supabase for current station+date
    loadLogsFromSupabase(state.station, state.date, function(freshLogs){
        // Merge: keep local entries not yet in server, add server entries
        freshLogs.forEach(function(fl){
            var exists = state.logs.find(function(l){
                return l.station===fl.station && l.system===fl.system && l.shift===fl.shift && l.date===fl.date;
            });
            if(!exists) state.logs.push(fl);
            else { var keepImgs = (exists.images && exists.images.length && (!fl.images || !fl.images.length)) ? exists.images : fl.images; Object.assign(exists, fl); exists.images = keepImgs; }
        });
        _renderSystemsUI(sc);
    });
}

    });
    sc.appendChild(node);
}

function handleImgUpload(e) {
    var files = e.target.files;
    if(!files||!files.length) return;
    var rem = 4 - state.images.length;
    if(rem<=0){ alert('لقد وصلت للحد الأقصى (4 صور).'); return; }
    var n = Math.min(files.length, rem);
    for(var i=0;i<n;i++){
        (function(f){
            var r = new FileReader();
            r.onload = function(ev){ state.images.push(ev.target.result); refreshImgGrid(document.getElementById('screens')); };
            r.readAsDataURL(f);
        })(files[i]);
    }
    e.target.value='';
}

function refreshImgGrid(root) {
    var grid = root.getElementById ? root.getElementById('imgGrid') : document.getElementById('imgGrid');
    var maxP = root.getElementById ? root.getElementById('imgMax')  : document.getElementById('imgMax');
    var inp  = root.getElementById ? root.getElementById('imgInput'): document.getElementById('imgInput');
    if(!grid) return;
    while(grid.firstChild) grid.removeChild(grid.firstChild);
    if(state.images.length>0){
        grid.style.display = 'grid';
        state.images.forEach(function(src, idx){
            var wrap = document.createElement('div');
            wrap.style.position = 'relative';
            var img = document.createElement('img');
            img.src = src;
            img.style.cssText = 'width:100%;height:110px;object-fit:cover;border-radius:10px;border:1px solid rgba(0,95,142,.12);';
            var del = document.createElement('button');
            del.textContent = '✕';
            del.style.cssText = 'position:absolute;top:4px;right:4px;background:#dc2626;color:white;border:none;border-radius:50%;width:22px;height:22px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;';
            del.onclick = function(){ state.images.splice(idx,1); refreshImgGrid(document.getElementById('screens')); };
            wrap.appendChild(img); wrap.appendChild(del);
            grid.appendChild(wrap);
        });
    } else {
        grid.style.display = 'none';
    }
    if(maxP) maxP.style.display = state.images.length>=4 ? 'block' : 'none';
    if(inp)  inp.style.display  = state.images.length>=4 ? 'none'  : 'block';
}

function doSave() {
    var note;
    if(state.status === 'na') {
        var naNoteEl = document.getElementById('naNote');
        note = naNoteEl ? naNoteEl.value.trim() : state.note;
    } else if(state.status === 'no_obs') {
        var noObsNoteEl = document.getElementById('noObsNote');
        note = noObsNoteEl ? noObsNoteEl.value.trim() : state.note;
    } else {
        note = document.getElementById('noteArea') ? document.getElementById('noteArea').value.trim() : state.note;
    }
    if(state.status==='remark'){
        if(!note){ alert('⚠️ في حالة وجود ملاحظة، يجب كتابة التفاصيل الميدانية.'); return; }
    }
    state.note = note;
    var now = new Date();
    var time = now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    var entry = {
        operator:state.opID, line:state.line, station:state.station,
        system:state.system, shift:state.shift, date:state.date, time:time,
        status:state.status, note:state.status==='no_obs'?'لا يوجد ملاحظات':state.note,
        images:[...state.images]
    };
    state.logs = state.logs.filter(function(l){ return !(l.station===state.station&&l.system===state.system&&l.shift===state.shift&&l.date===state.date); });
    state.logs = state.logs.filter(function(l){ return !(l.station===state.station&&l.system===state.system&&l.shift===state.shift&&l.date===state.date); });
    state.logs.unshift(entry);
    pushLogToSupabase(entry);
    state.screen='systems'; render();
}

function openSummary() {
    var modal = document.getElementById('summaryModal');
    modal.style.display = 'block';
    // Populate station dropdown
    var sel = document.getElementById('sumStation');
    sel.innerHTML = '';
    var stations = state.supervisor ? state.supervisor.stations : Object.values(STATIONS).map(function(s){return s.name;});
    stations.forEach(function(st){
        var o = document.createElement('option');
        o.value = st; o.textContent = st;
        if(st === state.adminStation) o.selected = true;
        sel.appendChild(o);
    });
    // Set date to today
    var dateIn = document.getElementById('sumDate');
    dateIn.value = state.adminDate || new Date().toISOString().split('T')[0];
    sel.onchange = function(){ buildSummary(); };
    dateIn.onchange = function(){ buildSummary(); };
    buildSummary();
}

function closeSummary() {
    document.getElementById('summaryModal').style.display = 'none';
}

function buildSummary() {
    var station = document.getElementById('sumStation').value;
    var date    = document.getElementById('sumDate').value;
    if(!station || !date) return;
    document.getElementById('sumContent').innerHTML = '<div style="text-align:center;padding:30px;color:#94a3b8;font-size:12px;">⏳ جاري التحميل...</div>';
    loadLogsForSummary(station, date, function(freshLogs){
        // update local cache
        freshLogs.forEach(function(fl){
            var exists = state.logs.find(function(l){
                return l.station===fl.station && l.system===fl.system && l.shift===fl.shift && l.date===fl.date;
            });
            if(!exists) state.logs.push(fl);
            else { var keepImgs2 = (exists.images && exists.images.length && (!fl.images || !fl.images.length)) ? exists.images : fl.images; Object.assign(exists, fl); exists.images = keepImgs2; }
        });
        _buildSummaryUI(station, date);
    });
}
function _buildSummaryUI(station, date) {

    // Format date arabic
    var dObj = new Date(date);
    var dayNames = ['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    var months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    var dateStr = dayNames[dObj.getDay()] + '، ' + dObj.getDate() + ' ' + months[dObj.getMonth()] + ' ' + dObj.getFullYear();

    document.getElementById('sumSubtitle').textContent = station + '  •  ' + dateStr;

    var systems = getSystems(station);
    var shifts = ['صباحي','مسائي'];
    var totalSys = systems.length * 2;
    var doneCount = 0, noObsCount = 0, remarkCount = 0, pendCount = 0;
    var content = '';

    shifts.forEach(function(sh){
        var shiftLabel = sh === 'صباحي' ? '☀️ الوردية الصباحية' : '🌙 الوردية المسائية';
        var rows = '';
        systems.forEach(function(sys){
            var log = getLog(sys, station, sh, date);
            var statusBadge, statusClass;
            if(!log){
                pendCount++;
                statusBadge = '<span style="font-size:9px;padding:3px 8px;border-radius:6px;background:rgba(254,202,202,.6);color:#dc2626;font-weight:700;">⚠️ معلق</span>';
                statusClass = 'rgba(254,242,242,.5)';
            } else if(log.status === 'no_obs'){
                noObsCount++;
                statusBadge = '<span style="font-size:9px;padding:3px 8px;border-radius:6px;background:rgba(220,252,231,.8);color:#16a34a;font-weight:700;">✅ سليم</span>';
                statusClass = 'rgba(240,253,244,.7)';
            } else {
                remarkCount++;
                statusBadge = '<span style="font-size:9px;padding:3px 8px;border-radius:6px;background:rgba(254,243,199,.8);color:#d97706;font-weight:700;">⚠️ ملاحظة</span>';
                statusClass = 'rgba(255,253,235,.7)';
            }
            if(log) doneCount++;

            var noteRow = '';
            if(log && log.note && log.note !== 'لا يوجد ملاحظات') {
                noteRow = '<div style="margin-top:5px;font-size:9px;color:#64748b;background:rgba(0,95,142,.04);padding:5px 8px;border-radius:6px;border-right:2px solid rgba(0,95,142,.2);">📝 '+log.note+'</div>';
            }
            var imgsRow = '';
            if(log && log.images && log.images.length) {
                imgsRow = '<div style="display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;">' +
                    log.images.map(function(src){
                        return '<img src="'+src+'" style="width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid rgba(0,95,142,.15);cursor:pointer;" onclick="window.open(this.src)">';
                    }).join('') + '</div>';
            }
            var opRow = log ? '<div style="font-size:9px;color:#94a3b8;margin-top:3px;">🕒 '+log.time+(log.opID ? '  •  رقم: '+log.opID : '')+'</div>' : '';

            rows += '<div style="padding:9px 12px;border-radius:12px;background:'+statusClass+';border:1.5px solid rgba(0,95,142,.1);margin-bottom:6px;">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                  '<div style="font-size:10px;font-weight:700;color:#1e3a5f;width:65%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">'+sys+'</div>' +
                  statusBadge +
                '</div>' + opRow + noteRow + imgsRow + '</div>';
        });

        content += '<div style="margin-bottom:16px;">' +
            '<div style="font-size:11px;font-weight:800;color:#003B5C;padding:8px 12px;background:rgba(0,59,92,.05);border-radius:10px;margin-bottom:8px;border-right:3px solid #0077B6;">'+shiftLabel+'</div>' +
            rows + '</div>';
    });

    // Stats bar
    var statsBar = document.getElementById('sumStats');
    statsBar.style.display = 'flex';
    statsBar.innerHTML =
        '<div style="flex:1;text-align:center;padding:8px;border-radius:10px;background:rgba(240,253,244,.8);border:1px solid rgba(16,185,129,.2);">' +
          '<div style="font-size:15px;font-weight:800;color:#16a34a;">'+noObsCount+'</div>' +
          '<div style="font-size:8px;color:#64748b;margin-top:2px;">✅ سليم</div></div>' +
        '<div style="flex:1;text-align:center;padding:8px;border-radius:10px;background:rgba(254,243,199,.8);border:1px solid rgba(217,119,6,.2);">' +
          '<div style="font-size:15px;font-weight:800;color:#d97706;">'+remarkCount+'</div>' +
          '<div style="font-size:8px;color:#64748b;margin-top:2px;">⚠️ ملاحظة</div></div>' +
        '<div style="flex:1;text-align:center;padding:8px;border-radius:10px;background:rgba(254,242,242,.8);border:1px solid rgba(220,38,38,.2);">' +
          '<div style="font-size:15px;font-weight:800;color:#dc2626;">'+pendCount+'</div>' +
          '<div style="font-size:8px;color:#64748b;margin-top:2px;">⏳ معلق</div></div>' +
        '<div style="flex:1;text-align:center;padding:8px;border-radius:10px;background:rgba(240,248,255,.8);border:1px solid rgba(0,95,142,.12);">' +
          '<div style="font-size:15px;font-weight:800;color:#003B5C;">'+Math.round(doneCount/totalSys*100)+'%</div>' +
          '<div style="font-size:8px;color:#64748b;margin-top:2px;">📊 نسبة الإنجاز</div></div>';

    document.getElementById('sumContent').innerHTML = content;
    document.getElementById('btnPrintSum').style.display = 'inline-block';
    document.getElementById('sumSubtitle').textContent = station + '  •  ' + dateStr;
}

function printSummary() {
    var station = document.getElementById('sumStation').value;
    var date    = document.getElementById('sumDate').value;
    var systems = getSystems(station);
    var dObj = new Date(date);
    var months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
    var dateStr = dObj.getDate() + ' ' + months[dObj.getMonth()] + ' ' + dObj.getFullYear();
    var LOGO_URL = 'https://cdn.phototourl.com/free/2026-05-25-531ef0be-b99a-4016-a928-effa7a2c41ac.png';

    var rows = '';
    ['صباحي','مسائي'].forEach(function(sh){
        var shLabel = sh==='صباحي' ? '☀️ الوردية الصباحية' : '🌙 الوردية المسائية';
        rows += '<tr><td colspan="4" style="background:#003B5C;color:#fff;font-weight:800;padding:8px 12px;font-size:12px;">' + shLabel + '</td></tr>';
        rows += '<tr style="background:#f0f8ff;font-size:10px;font-weight:700;color:#64748b;"><td style="padding:6px 10px;">النظام</td><td style="padding:6px 10px;text-align:center;">الحالة</td><td style="padding:6px 10px;">الوقت</td><td style="padding:6px 10px;">الملاحظة</td></tr>';
        systems.forEach(function(sys){
            var log = getLog(sys, station, sh, date);
            var status = !log ? 'معلق ⏳' : (log.status==='no_obs' ? '✅ سليم' : '⚠️ ملاحظة');
            var bg = !log ? '#fff5f5' : (log.status==='no_obs' ? '#f0fdf4' : '#fffbeb');
            rows += '<tr style="background:' + bg + ';border-bottom:1px solid #f1f5f9;">' +
                '<td style="padding:7px 10px;font-size:10px;font-weight:600;color:#1e3a5f;">' + sys + '</td>' +
                '<td style="padding:7px 10px;font-size:10px;text-align:center;">' + status + '</td>' +
                '<td style="padding:7px 10px;font-size:10px;color:#64748b;">' + (log ? log.time : '-') + '</td>' +
                '<td style="padding:7px 10px;font-size:9px;color:#64748b;">' + (log && log.note && log.note !== 'لا يوجد ملاحظات' ? log.note : '-') + '</td>' +
                '</tr>';
            if(log && log.images && log.images.length){
                var imgsHtml = log.images.map(function(src){
                    return '<img src="'+src+'" style="width:90px;height:90px;object-fit:cover;border-radius:6px;border:1px solid #cbd5e1;">';
                }).join('');
                rows += '<tr style="background:' + bg + ';border-bottom:1px solid #f1f5f9;">' +
                    '<td colspan="4" style="padding:6px 10px 12px;">' +
                    '<div style="font-size:9px;color:#64748b;font-weight:700;margin-bottom:6px;">📸 صور الإثبات:</div>' +
                    '<div style="display:flex;gap:8px;flex-wrap:wrap;">' + imgsHtml + '</div>' +
                    '</td></tr>';
            }
        });
    });

    var printArea = document.getElementById('summaryPrintArea');
    if (!printArea) {
        printArea = document.createElement('div');
        printArea.id = 'summaryPrintArea';
        document.body.appendChild(printArea);
    }
    printArea.innerHTML = 
        '<div style="padding:20px;direction:rtl;">' +
        '<div style="background:linear-gradient(135deg,#003B5C,#0077B6);padding:20px 24px;border-radius:12px;color:#fff;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;">' +
        '<div>' +
        '<div style="font-size:18px;font-weight:800;">📋 ملخص التشييكات اليومية</div>' +
        '<div style="font-size:12px;margin-top:6px;opacity:.85;">' + station + '  |  ' + dateStr + '</div>' +
        '<div style="font-size:9px;margin-top:4px;opacity:.7;">شركة نقل المياه (WTCO) — الجبيل</div>' +
        '</div>' +
        '<img src="'+LOGO_URL+'" style="height:84px;width:84px;object-fit:contain;background:rgba(255,255,255,.15);border-radius:14px;padding:8px;flex-shrink:0;" onerror="this.style.display=\'none\'">' +
        '</div>' +
        '<table style="width:100%;border-collapse:collapse;">' + rows + '</table>' +
        '<div style="margin-top:16px;font-size:9px;color:#94a3b8;text-align:center;">تم إنشاء هذا التقرير تلقائياً من نظام WTC Checklist</div>' +
        '</div>';

    var style = document.getElementById('printSummaryStyle');
    if (!style) {
        style = document.createElement('style');
        style.id = 'printSummaryStyle';
        style.textContent = '@media print { body > *:not(#summaryPrintArea) { display:none !important; } #summaryPrintArea { display:block !important; } img { -webkit-print-color-adjust:exact; print-color-adjust:exact; } table { page-break-inside:auto; } tr { page-break-inside:avoid; } }';
        document.head.appendChild(style);
    }
    window.print();
}

</script>

<!-- ════ WTCO SYSTEM BRIDGE (ربط تلقائي مع نظام WTCO) ════ -->
<script>
(function () {
  var CTX = { user:'', employee_no:'', role:'', lang:'ar', embedded:false, stationCode:'', stationName:'', stations:[] };

  function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]/g,''); }

  function findStation(code, name) {
    var c = norm(code), n = norm(name);
    var keys = Object.keys(STATIONS);
    var k = keys.find(function(x){ return norm(x) === c; });
    if (!k) k = keys.find(function(x){ return norm(STATIONS[x].name) === c; });
    if (!k && n) k = keys.find(function(x){ return norm(x) === n || norm(STATIONS[x].name) === n; });
    return k || '';
  }

  function isAdminRole(){ return /admin|مسؤول|مدير النظام/i.test(CTX.role); }
  function isSupRole(){ return /supervis|management|مشرف|إدارة/i.test(CTX.role) || isAdminRole(); }

  // المحطات المسموح بها للمشرف داخل لوحة المشرف
  function allowedStationNames() {
    var out = [];
    (CTX.stations || []).forEach(function (s) {
      var k = findStation(s.code || s.raw_code || '', s.name_en || s.name_ar || s.name || s);
      if (k && out.indexOf(STATIONS[k].name) === -1) out.push(STATIONS[k].name);
    });
    if (!out.length && state.station) out.push(state.station);
    return out;
  }

  function applyRoleLimits() {
    // زر لوحة المشرف: للمشرف/الإدارة/الأدمن فقط
    var sup = document.getElementById('supBtn');
    if (sup) sup.style.display = (!CTX.role || isSupRole()) ? '' : 'none';
    // تعديل نقاط الفحص: للأدمن فقط
    var edit = document.getElementById('btnEditItems');
    if (edit) edit.style.display = isAdminRole() ? '' : 'none';
    if (state.screen === 'editItems' && CTX.role && !isAdminRole()) {
      state.screen = 'adminSel';
    }
    // حصر قائمة المحطات بالمحطات المرتبطة بالحساب (غير الأدمن)
    window.WTCO_ALLOWED_STATIONS = isAdminRole() ? null : allowedStationNames();
    // المشغل مربوط بمحطته: لا يمكنه تغيير المحطة إطلاقاً — نحذف الزر نهائياً
    var logout = document.getElementById('btnLogout');
    if (logout && CTX.role && !isSupRole() && logout.parentNode) logout.parentNode.removeChild(logout);
    if (CTX.role && !isSupRole() && state.station && state.screen === 'select') {
      state.screen = 'systems';
    }
    // حصر محطات لوحة المشرف بمحطاته
    if (state.isAdmin && CTX.role && !isAdminRole()) {
      var allowed = allowedStationNames();
      state.supervisor = { stations: allowed };
      if (allowed.indexOf(state.adminStation) === -1) state.adminStation = allowed[0] || '';
    }
  }


  function updateHeader() {
    var nameEl = document.querySelector('.wtc-header-name');
    var subEl  = document.querySelector('.wtc-header-sub');
    if (nameEl && CTX.user) nameEl.textContent = CTX.user + (CTX.employee_no ? '  ·  #' + CTX.employee_no : '');
    if (subEl) {
      var bits = [];
      if (CTX.role) bits.push(CTX.role);
      if (state.station) bits.push(state.station);
      if (bits.length) subEl.textContent = bits.join('  ·  ');
    }
    applyRoleLimits();
  }

  function applyCtx(ctx) {
    if (!ctx) return;
    CTX = Object.assign(CTX, ctx);
    if (CTX.user) state.opID = CTX.employee_no || CTX.user;
    var key = findStation(CTX.stationCode, CTX.stationName);
    if (key) {
      state.station = STATIONS[key].name;
      state.line    = STATIONS[key].line;
      state.shift   = getShift();
      state.date    = new Date().toISOString().split('T')[0];
      if (state.screen === 'select') state.screen = 'systems';
    }
    // المشرف/الإدارة/الأدمن: الدخول مباشرة إلى لوحة المشرف
    if (CTX.role && isSupRole() && !window.__wtcoSupRouted) {
      window.__wtcoSupRouted = true;
      var supStations = isAdminRole()
        ? Object.keys(STATIONS).map(function (k) { return STATIONS[k].name; })
        : allowedStationNames();
      state.isAdmin = true;
      state.supervisor = { stations: supStations };
      if (supStations.indexOf(state.adminStation) === -1) state.adminStation = supStations[0] || '';
      state.screen = 'adminSel';
    }
    updateHeader();
    render();
  }


  // ── إرسال التقرير النهائي للمشرف عبر النظام ──────────────────────────
  function currentLogs() {
    return state.logs.filter(function (l) {
      return l.station === state.station && l.shift === state.shift && l.date === state.date;
    });
  }

  function sendFinal(btn) {
    var logs = currentLogs();
    var systems = getSystems(state.station);
    if (logs.length < systems.length) {
      if (!confirm('لم تكتمل جميع الأنظمة (' + logs.length + '/' + systems.length + '). إرسال التقرير الآن؟')) return;
    }
    if (btn) { btn.disabled = true; btn.textContent = '⏳ جارٍ الإرسال...'; }
    window.__wtcoSendBtn = btn;
    var payload = {
      type: 'WTCO_CHECKLIST_SUBMIT',
      station: { name: state.station, code: findStation('', state.station) },
      user: { full_name: CTX.user, employee_no: CTX.employee_no, role: CTX.role },
      date: state.date,
      shift: state.shift,
      summary: {
        ok: logs.filter(function (l) { return l.status === 'no_obs'; }).length,
        remark: logs.filter(function (l) { return l.status === 'remark'; }).length,
        na: logs.filter(function (l) { return l.status === 'na'; }).length,
        total: systems.length
      },
      remarks: logs.filter(function (l) { return l.status === 'remark'; }).map(function (l) {
        return { system: l.system, note: l.note, time: l.time };
      })
    };
    try {
      if (window.parent && window.parent !== window) window.parent.postMessage(payload, '*');
      else if (window.opener) window.opener.postMessage(payload, '*');
      else throw new Error('no host');
    } catch (e) {
      if (btn) { btn.disabled = false; btn.textContent = '📤 إرسال التقرير النهائي للمشرف'; }
      alert('تعذّر الإرسال: الصفحة غير مضمّنة داخل النظام.');
    }
  }

  function injectSendButton() {
    if (state.screen !== 'systems') return;
    var list = document.getElementById('systemsList');
    if (!list || document.getElementById('wtcoSendFinal')) return;
    var wrap = document.createElement('div');
    wrap.style.cssText = 'margin-bottom:24px;';
    var b = document.createElement('button');
    b.id = 'wtcoSendFinal';
    b.className = 'btn-primary';
    b.textContent = '📤 إرسال التقرير النهائي للمشرف';
    b.onclick = function () { sendFinal(b); };
    wrap.appendChild(b);
    list.parentNode.appendChild(wrap);
  }

  // hook على render لإضافة الزر وتحديث الهيدر بعد كل رسم
  var _render = render;
  render = function () {
    var before = state.screen;
    _render.apply(this, arguments);
    applyRoleLimits();
    if (state.screen !== before) { _render.apply(this, arguments); }
    setTimeout(function () { injectSendButton(); updateHeader(); }, 0);
  };
  window.render = render;

  // حصر لوحة المشرف بمحطاته عند فتحها
  var supEl = document.getElementById('supBtn');
  if (supEl) {
    var _supClick = supEl.onclick;
    supEl.onclick = function () {
      if (_supClick) _supClick.apply(this, arguments);
      applyRoleLimits();
      render();
    };
  }

  // ── استقبال السياق ────────────────────────────────────────────────
  var p = new URLSearchParams(location.search);
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d) return;
    if (d.type === 'WTCO_CONTEXT') {
      applyCtx({
        stationCode: (d.station && (d.station.code || d.station.raw_code)) || '',
        stationName: (d.station && (d.station.name_en || d.station.name_ar || d.station.name)) || '',
        stations: d.stations || [],
        user: (d.user && (d.user.full_name || d.user.name)) || '',
        employee_no: (d.user && d.user.employee_no) || '',
        role: (d.user && d.user.role) || '',
        lang: d.lang || 'ar',
        embedded: true
      });
    }
    if (d.type === 'WTCO_SUBMIT_RESULT') {
      var b = window.__wtcoSendBtn;
      if (b) {
        b.disabled = false;
        b.textContent = d.ok ? '✅ تم إرسال التقرير للمشرف' : '📤 إرسال التقرير النهائي للمشرف';
      }
      if (!d.ok) alert('تعذّر إرسال التقرير: ' + (d.error || 'خطأ غير معروف'));
    }
  });

  if (p.get('station') || p.get('user') || p.get('station_code')) {
    applyCtx({
      stationCode: p.get('station') || p.get('station_code') || '',
      stationName: p.get('station_name') || '',
      stations: (p.get('stations') || '').split('|').filter(Boolean).map(function (n) { return { name: n }; }),
      user: p.get('user') || '',
      employee_no: p.get('employee_no') || '',
      role: p.get('role') || '',
      lang: p.get('lang') || 'ar',
      embedded: p.get('embedded') === '1'
    });
  } else {
    updateHeader();
  }


  try { window.parent.postMessage({ type: 'WTCO_CHECKLIST_READY', version: '3.0' }, '*'); } catch (e) {}
})();
</script>
