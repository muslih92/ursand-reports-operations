server {
    listen 80;
    server_name jrwts-urs-operation.com www.jrwts-urs-operation.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name jrwts-urs-operation.com www.jrwts-urs-operation.com;

    ssl_certificate     /etc/letsencrypt/live/jrwts-urs-operation.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jrwts-urs-operation.com/privkey.pem;

    client_max_body_size 50m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; img-src 'self' data: blob: https:; font-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.lovable.app https://app.powerbi.com; frame-src 'self' https://app.powerbi.com https://*.powerbi.com; worker-src 'self' blob:; upgrade-insecure-requests" always;

    # Block internal dev/file-system endpoints from ever being exposed in production
    location ^~ /server/ { return 404; }
    location ^~ /@fs/   { return 404; }
    location ^~ /@vite/ { return 404; }
    location ^~ /.git   { return 404; }
    location ~ /\.env   { return 404; }

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

}
